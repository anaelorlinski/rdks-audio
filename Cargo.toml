# rdks-audio: audio crates under MIT OR Apache-2.0. Each crate builds on its own; the workspace shares settings only.
[workspace]
members = ["rdks-audio-decode", "symphonia-adapter-applecoreaudio"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

# The tests compare decodes sample by sample against their sources: too slow unoptimised.
[profile.dev]
opt-level = 1
